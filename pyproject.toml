[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "localisation-sources"
version = "1.0.0"
description = "Localisation de sources ponctuelles (noyau 1/r²) : Prony, ML + BIC, BLASSO, descente de gradient"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["localisation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
