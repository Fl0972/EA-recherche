# Problème inverse

reconstruction:
  # Retire des mesures la contribution (connue) des sources fixes, par ex. la
  # source centrale, avant l'inversion. Le bruit, lui, n'est pas retiré.
  subtract_fixed_sources: true

  # Méthode de reconstruction
  #   prony  {n_sources, rank_tol}
  #       n_sources : nombre de sources imposé, ou null pour l'estimer
  #       rank_tol  : seuil relatif sur les valeurs singulières pour estimer N.
  #                   À adapter au bruit : ~1e-8 sans bruit, ~5 * sigma sinon.
  method:
    name: prony
    params: {n_sources: null, rank_tol: 0.005}
